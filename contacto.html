<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Contacto · Brisa Achilli</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,700;1,400;1,700&family=Black+And+White+Picture&display=swap"
        rel="stylesheet">
    <link rel="icon" href="img/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="header"><a class="logo" href="proyectos.html">Proyectos</a>
        <a href="proyectos.html"><img src="img/boton-back.png" alt="Boton Volver">
            <a href="proyectos.html" aria-label="Inicio" style="justify-self:end">
            </a>
    </header>
    <main class="contacto">
        <h2 class="sticker sticker--lima">Trabajemos juntos :)</h2>
        <p>¿Tenés un proyecto en mente, una consulta o querés que colaboremos?</p>
        <p>Dejame un mensaje y te respondo lo antes posible.</p>
        <form action="#" method="post">
            <label>¿Cómo te llamás?<input type="text" name="nombre" placeholder="Ej: Ratón Pérez" required></label>
            <label>Tu mail<input type="email" name="mail" placeholder="tu@correo.com" required></label>
            <label>¿De qué es tu proyecto?<input type="text" name="tipo"
                    placeholder="Ej: Diseño web, Identidad de marca, Rediseño, Otro."></label>
            <label>Contame sobre tu idea<textarea name="idea"
                    placeholder="Contame los detalles, plazos estimados o lo que necesites..."></textarea></label>
            <button class="pill" type="submit">Enviar</button>
        </form>
    </main>
    <footer class="footer">
        <ul>
            <li><a href="#"><img src="img/logo_instagram.png"> </a></li>
            <li><a href="#"><img src="img/logo_tktok.png"></a></li>
            <li><a href="#"><img src="img/logo_wpp.png"></a></li>
            <li><a href="#"><img src="img/logo_linkedin_.png"></a></li>
        </ul>
        <p class="frase">We were gifted with thought.<small>Holding On To You - Twenty One Pilots</small></p>
    </footer>
</body>

</html>
